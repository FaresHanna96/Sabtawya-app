<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="نظام إدارة الحضور والطايو">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1B3A6B">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="خدمة 3:6 ابتدائي السبت">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>خدمة 3:6 ابتدائي السبت</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->

  <!-- Loading splash shown until Flutter renders its first frame -->
  <div id="app-loading" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1B1F5E;z-index:9999;transition:opacity .4s ease;">
    <img src="icons/Icon-192.png" width="80" style="border-radius:20px;margin-bottom:28px;box-shadow:0 8px 24px rgba(0,0,0,.4);">
    <div style="width:180px;height:4px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden;">
      <div style="height:100%;background:#E8C547;border-radius:2px;animation:ldbar 4s ease-in-out forwards;"></div>
    </div>
    <p id="app-loading-text" style="color:rgba(255,255,255,.6);margin-top:18px;font-size:13px;font-family:Arial,sans-serif;">جاري التحميل…</p>
    <button id="app-retry" type="button" onclick="location.reload()" style="display:none;margin-top:4px;padding:10px 28px;border:0;border-radius:999px;background:#fff;color:#1B3A6B;font:bold 14px Arial,sans-serif;">حاول تاني</button>
  </div>
  <style>
    body { margin: 0; background: #1B1F5E; }
    @keyframes ldbar { 0% { width: 0 } 40% { width: 50% } 80% { width: 85% } 100% { width: 95% } }
  </style>
  <script>
    // A load that failed or is taking too long gets a way out.
    function sabtawyaStuck() {
      var button = document.getElementById('app-retry');
      if (!button) return;
      document.getElementById('app-loading-text').textContent =
        'التحميل واخد وقت. اتأكد من النت وحاول تاني.';
      button.style.display = 'block';
    }
    var stuckTimer = setTimeout(sabtawyaStuck, 20000);
    window.addEventListener('flutter-first-frame', function () {
      clearTimeout(stuckTimer);
      var el = document.getElementById('app-loading');
      if (el) { el.style.opacity = '0'; setTimeout(function () { el.remove(); }, 450); }
    });
    // Saves the app on the phone so it opens without internet (app-sw.js).
    // Not on a developer's machine, where a saved copy only gets in the way.
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('app-sw.js').catch(function () {});
      });
      // On the very first visit the files load before the worker is there, so
      // once the app is up it is told which ones to save.
      window.addEventListener('flutter-first-frame', function () {
        setTimeout(function () {
          navigator.serviceWorker.ready.then(function (reg) {
            if (!reg.active) return;
            var files = performance.getEntriesByType('resource')
              .map(function (e) { return e.name; });
            reg.active.postMessage({ save: ['/'].concat(files) });
          });
        }, 8000);
      });
    }
  </script>

  <script src="pwa.js"></script>
  <script src="flutter_bootstrap.js" async onerror="sabtawyaStuck()"></script>
</body>
</html>
