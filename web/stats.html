<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>إحصائيات التحميل</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;
       background:#f6f3ee;color:#1d2b4f;display:flex;justify-content:center}
  .wrap{width:100%;max-width:520px;padding:20px 16px 40px}
  h1{font-size:20px;margin:6px 0 16px;text-align:center}
  .card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px rgba(0,0,0,.07)}
  .card h2{font-size:15px;margin:0 0 12px}
  input{width:100%;padding:12px;margin:6px 0;border:1px solid #d8d2c6;border-radius:12px;font-size:15px}
  button{background:#7a1f2b;color:#fff;border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer;width:100%;margin-top:8px}
  .err{color:#b3261e;font-size:13px;margin-top:8px;min-height:16px}
  .chips{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .chip{border:1px solid #d8d2c6;background:#fff;border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;width:auto;margin:0;color:#1d2b4f;font-weight:600}
  .chip.on{background:#7a1f2b;color:#fff;border-color:#7a1f2b}
  .tot{display:flex;gap:10px;margin-bottom:14px}
  .t{flex:1;border-radius:16px;padding:14px 6px;text-align:center}
  .t b{display:block;font-size:28px;margin:4px 0}
  .t span{font-size:11.5px;color:#6b7280}
  .t.a{background:#7a1f2b14;color:#7a1f2b}.t.b{background:#2b7bb914;color:#2b7bb9}.t.c{background:#6b7a2214;color:#6b7a22}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  td,th{padding:7px 4px;text-align:right;border-bottom:1px solid #f0ece4}
  th{color:#6b7280;font-weight:600;font-size:12px}
  .bar{height:9px;border-radius:5px;background:#7a1f2b;min-width:2px}
  .barbg{background:#7a1f2b14;border-radius:5px;width:100%}
  .muted{color:#6b7280;font-size:12px;line-height:1.7}
  .top{display:flex;justify-content:space-between;align-items:center}
  .link{background:none;color:#7a1f2b;width:auto;padding:4px 8px;margin:0;font-size:13px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>إحصائيات التحميل والاستخدام</h1>

  <div class="card" id="login">
    <h2>دخول الأدمن</h2>
    <input id="email" type="email" placeholder="الإيميل" autocomplete="username" dir="ltr">
    <input id="pass" type="password" placeholder="كلمة المرور" autocomplete="current-password" dir="ltr">
    <button id="go">دخول</button>
    <div class="err" id="err"></div>
    <p class="muted">الأرقام تظهر للأدمن فقط. لا يتم حفظ كلمة المرور.</p>
  </div>

  <div id="stats" hidden>
    <div class="top">
      <div class="chips" id="chips"></div>
      <button class="link" id="out">خروج</button>
    </div>
    <div class="tot">
      <div class="t a"><span>تحميلات التطبيق</span><b id="n_dl">0</b></div>
      <div class="t b"><span>زيارات صفحة التحميل</span><b id="n_pg">0</b></div>
      <div class="t c"><span>مرات فتح التطبيق</span><b id="n_op">0</b></div>
    </div>
    <div class="card"><h2>حسب الجهاز</h2><table id="dev"></table></div>
    <div class="card"><h2>حسب اليوم</h2><table id="days"></table></div>
    <p class="muted">التحميل على أندرويد يُحسب عند فتح صفحة التحميل حتى لو أُلغي الملف. فتح التطبيق يُحسب عند كل تشغيل. الأيام بتوقيت القاهرة.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  var sb = supabase.createClient(
    'https://fxclufgfkvfrhdleyndf.supabase.co',
    'sb_publishable_5j2lzDrUoKL3RUlJTIBoag_fU8ClIuT',
    {auth: {persistSession: false, autoRefreshToken: false}}
  );
  var days = 30;
  var $ = function (id) { return document.getElementById(id); };
  var PLAT = {android: 'أندرويد', ios: 'آيفون', web: 'موقع', other: 'كمبيوتر/غيره'};

  function chips() {
    $('chips').innerHTML = '';
    [7, 30, 90].forEach(function (d) {
      var b = document.createElement('button');
      b.className = 'chip' + (d === days ? ' on' : '');
      b.textContent = 'آخر ' + d + ' يوم';
      b.onclick = function () { days = d; load(); };
      $('chips').appendChild(b);
    });
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  async function load() {
    chips();
    var r = await sb.rpc('access_stats', {p_days: days});
    if (r.error) { show(false); $('err').textContent = r.error.message; return; }
    var rows = r.data || [];
    var tot = {apk_download: 0, apk_page: 0, app_open: 0};
    var dev = {};
    var byDay = {};
    rows.forEach(function (x) {
      tot[x.kind] = (tot[x.kind] || 0) + x.n;
      var d = dev[x.platform] = dev[x.platform] || {apk_download: 0, apk_page: 0, app_open: 0};
      d[x.kind] += x.n;
      var y = byDay[x.day] = byDay[x.day] || {apk_download: 0, apk_page: 0, app_open: 0};
      y[x.kind] += x.n;
    });
    $('n_dl').textContent = tot.apk_download;
    $('n_pg').textContent = tot.apk_page;
    $('n_op').textContent = tot.app_open;

    var h = '<tr><th>الجهاز</th><th>تحميل</th><th>زيارة</th><th>فتح</th></tr>';
    Object.keys(dev).forEach(function (p) {
      h += '<tr><td>' + esc(PLAT[p] || p) + '</td><td>' + dev[p].apk_download + '</td><td>' + dev[p].apk_page + '</td><td>' + dev[p].app_open + '</td></tr>';
    });
    if (!Object.keys(dev).length) h += '<tr><td colspan="4" class="muted">لا توجد بيانات</td></tr>';
    $('dev').innerHTML = h;

    var keys = Object.keys(byDay).sort().reverse();
    var max = 1;
    keys.forEach(function (k) { if (byDay[k].apk_download > max) max = byDay[k].apk_download; });
    h = '<tr><th>اليوم</th><th style="width:38%">تحميل</th><th>زيارة</th><th>فتح</th></tr>';
    keys.forEach(function (k) {
      var v = byDay[k], p = k.split('-');
      h += '<tr><td dir="ltr">' + p[2] + '/' + p[1] + '</td><td><div class="barbg"><div class="bar" style="width:' +
           Math.round(v.apk_download / max * 100) + '%"></div></div>' + v.apk_download + '</td><td>' + v.apk_page + '</td><td>' + v.app_open + '</td></tr>';
    });
    $('days').innerHTML = h;
    show(true);
  }

  function show(on) { $('stats').hidden = !on; $('login').hidden = on; }

  $('go').onclick = async function () {
    $('err').textContent = '';
    var r = await sb.auth.signInWithPassword({email: $('email').value.trim(), password: $('pass').value});
    $('pass').value = '';
    if (r.error) { $('err').textContent = 'الإيميل أو كلمة المرور غير صحيحة'; return; }
    await load();
  };
  $('pass').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('go').click(); });
  $('out').onclick = async function () { await sb.auth.signOut(); show(false); };
</script>
</body>
</html>
